=====================  EduTest LMS v9.1 — HƯỚNG DẪN TRIỂN KHAI FIREBASE  =====================
Collections: users, classes, exams (đề KHÔNG chứa đáp án), examKeys (đáp án + giải thích, chỉ GV chủ đề đọc được),
             submissions (kết quả), drafts (bài làm nháp, chống F5), _clock (lấy giờ máy chủ).
CFG.GRADING trong code: 'sim' = chấm giả lập trên máy (chạy thử, đáp án nằm riêng trong KeyStore, không vào state học sinh)
                        'cloud' = chấm bằng Cloud Function submitExam (BẢO MẬT THẬT, cần gói Blaze). Khi bật 'cloud' dùng rules bên dưới.

--- FIRESTORE RULES ---
rules_version = '2';
service cloud.firestore { match /databases/{database}/documents {
  function me() { return request.auth != null ? 'g_' + request.auth.uid : null; }
  match /users/{id} {
    allow read: if request.auth != null;
    allow create, delete: if id == me();
    allow update: if id == me() || (request.auth != null && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['friends','requests']));
  }
  match /classes/{id} {
    allow read: if request.auth != null;
    allow create: if request.resource.data.teacherId == me();
    allow delete: if resource.data.teacherId == me();
    allow update: if resource.data.teacherId == me() || (request.auth != null && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['students','pending','invites']));
  }
  match /exams/{id} {
    allow read: if request.auth != null;
    allow create: if request.resource.data.teacherId == me();
    allow update, delete: if resource.data.teacherId == me();
  }
  match /examKeys/{id} {   // v5 chế độ 'sim': HS đã đăng nhập đọc được khóa để chấm (muốn bảo mật thật: dùng 'cloud' + đổi read thành resource.data.teacherId == me())
    allow read: if request.auth != null;
    allow create, update, delete: if request.auth != null && (resource == null ? request.resource.data.teacherId == me() : resource.data.teacherId == me());
  }
  match /submissions/{id} {
    allow read: if resource.data.studentId == me() || resource.data.teacherId == me();
    allow create: if request.resource.data.studentId == me();   // v5 chế độ 'sim'. Chế độ 'cloud' đổi thành false.  // chỉ Cloud Function (Admin SDK) được ghi. Chế độ 'sim': đổi thành  request.resource.data.studentId == me()
    allow delete: if resource.data.teacherId == me();
  }
  match /drafts/{id} {
    allow read: if request.auth != null && (resource.data.uid == me() || resource.data.teacherId == me());   // v6: GV đọc bài nháp để giám sát trực tiếp
    allow create: if request.auth != null && request.resource.data.uid == me();
    allow update: if request.auth != null && (resource.data.uid == me() || (resource.data.teacherId == me() && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['forceSubmit'])));
    allow delete: if request.auth != null && resource.data.uid == me();
  }
  // v5.2 – danh sách học sinh & đăng nhập bằng mã (cần bật Authentication → Anonymous)
  match /rosters/{cid} { allow read, write: if request.auth != null && (resource == null ? request.resource.data.teacherId == me() : resource.data.teacherId == me()); }
  match /rcodes/{code} {
    allow get: if request.auth != null;
    allow list: if request.auth != null && resource.data.teacherId == me();
    allow create: if request.auth != null && request.resource.data.teacherId == me();
    allow update: if request.auth != null && (resource.data.teacherId == me() || request.resource.data.diff(resource.data).affectedKeys().hasOnly(['uid']));
    allow delete: if request.auth != null && resource.data.teacherId == me();
  }
  match /presence/{uid} { allow read: if request.auth != null; allow write: if request.auth != null && request.auth.uid == uid; }
  match /_clock/{uid} { allow read, write: if request.auth != null && request.auth.uid == uid; }
}}

--- CLOUD FUNCTION (functions/index.js · Node 18+ · firebase-functions v4+ · bật CFG.GRADING = 'cloud') ---
const { onCall, HttpsError } = require('firebase-functions/v2/https');
const admin = require('firebase-admin'); admin.initializeApp();
const norm = s => String(s).trim().toLowerCase().replace(/\s+/g, ' ');
const has = a => a !== undefined && a !== '' && !(typeof a === 'object' && a !== null && !Object.keys(a).length);
exports.submitExam = onCall(async req => {
  if (!req.auth) throw new HttpsError('unauthenticated', 'Cần đăng nhập');
  const me = 'g_' + req.auth.uid, { examId, draftKey, answers = {}, viol = 0, vlog = [] } = req.data, db = admin.firestore(), t = Date.now();
  const [ex, ky, dr] = await Promise.all([db.doc('exams/' + examId).get(), db.doc('examKeys/' + examId).get(), db.doc('drafts/' + draftKey).get()]);
  if (!ex.exists || !ky.exists) throw new HttpsError('not-found', 'Không tìm thấy đề hoặc đáp án');
  const e = ex.data(), k = ky.data(), d = dr.exists ? dr.data() : null;
  if (!d || d.uid !== me) throw new HttpsError('failed-precondition', 'Không có bài đang làm');
  if (e.closeAt && d.start > e.closeAt) throw new HttpsError('failed-precondition', 'Đề đã đóng');
  if (e.openAt && d.start < e.openAt) throw new HttpsError('failed-precondition', 'Đề chưa mở');
  if (t > d.start + e.minutes * 60000 + 60000) throw new HttpsError('deadline-exceeded', 'Quá thời gian làm bài');
  const TFG = [0, 0.1, 0.25, 0.5, 1], DEF = { mc: 0.25, short: 0.25, match: 0.25, tf: 0.25, tfg: 1 };
  const num = s => { s = String(s).trim().replace(/\s+/g, '').replace(',', '.'); return /^[-+]?\d+(\.\d+)?$/.test(s) ? parseFloat(s) : NaN; };
  const same = (x, y) => (norm(x) && norm(x) === norm(y)) || (isFinite(num(x)) && isFinite(num(y)) && Math.abs(num(x) - num(y)) < 1e-9);
  const order = Array.isArray(d.order) && d.order.length ? d.order : e.questions.map((_, i) => i);
  const detail = order.map(i => {
    const p = e.questions[i], q = k.q[i] || {}, a = answers[i], w = +p.pts > 0 ? +p.pts : (DEF[p.type] || 0.25);
    let r = null, f = 0, c = '', at = '', ex = {};
    const tt = arr => [0, 1, 2, 3].map(j => 'abcd'[j] + ') ' + (typeof arr[j] === 'boolean' ? (arr[j] ? 'Đúng' : 'Sai') : '—')).join('; ');
    if (p.type === 'mc') { c = 'ABCD'[q.correct] + '. ' + p.opts[q.correct]; if (has(a)) { r = a === q.correct; at = 'ABCD'[a] + '. ' + p.opts[a]; } }
    else if (p.type === 'tf') { c = q.correct ? 'Đúng' : 'Sai'; if (has(a)) { r = a === q.correct; at = a ? 'Đúng' : 'Sai'; } }
    else if (p.type === 'tfg') {
      const ck = (q.correct || []).map(x => x !== false), sa = [0, 1, 2, 3].map(j => a && typeof a[j] === 'boolean' ? a[j] : null);
      c = tt(ck); at = has(a) ? tt(sa) : '';
      if (has(a)) { const n = sa.filter((v, j) => v !== null && v === ck[j]).length; r = n === 4; f = TFG[n]; ex = { sa, sc: ck, n }; }
    }
    else if (p.type === 'short') { c = String(q.answers).split('|')[0]; if (has(a)) { r = String(q.answers).split('|').some(x => same(x, a)); at = String(a); } }
    else { c = p.lefts.map((l, j) => l + ' → ' + p.rights[q.map[j]]).join('; '); if (has(a)) { r = q.map.every((m, j) => a[j] === m); at = p.lefts.map((l, j) => l + ' → ' + (a[j] !== undefined ? p.rights[a[j]] : '?')).join('; '); } }
    if (p.type !== 'tfg') f = r === true ? 1 : 0;
    return { qi: i, lv: p.level || 1, r, f, w, a: at, c, x: q.explanation || '', t: p.text, y: p.type, ...ex };
  });
  const total = detail.length, correct = detail.filter(x => x.r === true).length, max = detail.reduce((s, x) => s + x.w, 0), got = detail.reduce((s, x) => s + x.w * x.f, 0);
  const score = max > 0 ? Math.round(got / max * 1000) / 100 : 0;
  const ref = db.collection('submissions').doc(), sub = { id: ref.id, examId, teacherId: e.teacherId, title: e.title, studentId: me, score, correct, total, pts: Math.round(got * 100) / 100, max: Math.round(max * 100) / 100, pass: score >= e.pass, detail, answers, viol: Math.min(+viol || 0, 999), vlog: vlog.slice(-50), at: t };
  await ref.set(sub); return sub;
});
Triển khai: firebase deploy --only functions,firestore:rules

'use strict';
/* ============ 0. TIỆN ÍCH ============ */
const $=s=>document.querySelector(s);

function splitExam(e){const pub={...e,questions:[]},key={q:[]};delete pub._cid;delete pub._pw;
  e.questions.forEach(q=>{const p={type:q.type,text:q.text,img:q.img||'',level:q.level||1},k={explanation:q.explanation||''};
    if(+q.pts>0)p.pts=+q.pts;
    if(q.type==='mc'){p.opts=[...q.opts];k.correct=q.correct}
    else if(q.type==='tfg'){p.stmts=q.stmts.map(s=>s.t);k.correct=q.stmts.map(s=>!!s.c)}
    else if(q.type==='tf')k.correct=!!q.correct;
    else if(q.type==='match'){const ord=seedShuffle(q.pairs.length,e.id+q.text);p.lefts=q.pairs.map(x=>x.l);p.rights=ord.map(j=>q.pairs[j].r);k.map=q.pairs.map((_,i)=>ord.indexOf(i))}
    else k.answers=q.answers;
    pub.questions.push(p);key.q.push(k)});
  return {pub,key}}
function mergeExam(pub,key){const e=JSON.parse(JSON.stringify(pub));
  e.questions=e.questions.map((p,i)=>{const k=(key&&key.q[i])||{},q={type:p.type,text:p.text,img:p.img||'',level:p.level||1,explanation:k.explanation||''};if(+p.pts>0)q.pts=+p.pts;
    if(p.type==='mc'){q.opts=p.opts;q.correct=k.correct??0}
    else if(p.type==='tfg')q.stmts=(p.stmts||[]).map((t,j)=>({t,c:(k.correct||[])[j]!==false}));

  if(p.type==='short')return typeof a==='string'&&String(k.answers).split('|').some(x=>sameAns(x,a));

function exportCSV(id){const e=db.exams[id],ss=Object.values(db.subs).filter(s=>s.examId===id).sort((a,b)=>a.at-b.at);
  if(!ss.length)return toast('Chưa có bài nộp để xuất','info');
  const cell=v=>{let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return /[",;\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const xl=s=>s.score<e.pass?'Chưa hoàn thành (CHT)':s.score>=8?'Hoàn thành tốt (HTT)':'Hoàn thành (HT)',lv=s=>{const a=[[0,0],[0,0],[0,0]];(s.detail||[]).forEach(d=>{const k=Math.min(3,Math.max(1,d.lv||1))-1;a[k][1]++;if(d.r===true)a[k][0]++});return a.map(x=>x[1]?x[0]+' đúng / '+x[1]+' câu':'')};
  const head=['STT','Mã HS','Tên HS','Điểm (thang 10)','Điểm gốc','Kết quả (Đạt/Trượt)','Xếp loại năng lực (TT27)','Mức 1 Nhận biết','Mức 2 Thông hiểu','Mức 3 Vận dụng','Thời gian nộp bài','Số lần chuyển tab (vi phạm)',...e.questions.map((_,i)=>'Câu '+(i+1)+' (Đúng/Sai/Bỏ trống)')];
  const rows=ss.map((s,n)=>{const u=db.users[s.studentId]||{};return [n+1,u.pid||'',u.name||'(đã xóa)',s.score,(s.max!==undefined?s.pts+' trên '+s.max:''),s.pass?'Đạt':'Trượt',xl(s),...lv(s),fdate(s.at),s.viol||0,...e.questions.map((_,i)=>{const d=dOf(s,i);return !d?((s.detail||[]).some(x=>x.qi!==undefined)?'Không bốc':'Bỏ trống'):d.r===true?'Đúng':d.r===false?(d.y==='tfg'&&d.n>0?'Một phần ('+d.n+'/4 ý)':'Sai'):'Bỏ trống'})]});
  const text='\ufeffsep=,\r\n'+[head,...rows].map(r=>r.map(cell).join(',')).join('\r\n'),a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download=(e.title||'ket-qua').replace(/[\\/:*?"<>|]+/g,'_').trim()+'_ket-qua.csv';
  document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast('Đã xuất '+rows.length+' bài nộp','success')}
async function dupExam(id){const e=JSON.parse(JSON.stringify(db.exams[id])),k=await KeyStore.get(id).catch(()=>null);e.id=uid();e.code=genId('ktra',Object.values(db.exams).map(x=>x.code));e.title+=' (bản sao)';e.status='queue';e.published=false;e.history=[];
  if(k)await KeyStore.set(e.id,k);db.exams[e.id]=e;save();toast('Đã nhân bản','success');render()}

/* --- Danh sách học sinh (JSON từ AI) + trạng thái online/offline --- */
const ROSTER_PROMPT=`Hãy đọc danh sách học sinh trong file Excel/Word tôi đính kèm và chuyển thành một mảng JSON. Trả về CHỈ mã JSON, không giải thích. Định dạng bắt buộc:
[
  { "code": "HS001", "name": "Nguyễn Văn An" },
  { "code": "HS002", "name": "Trần Thị Bình" }
]
Quy tắc: "code" là mã học sinh trong file (nếu file không có mã thì tự đặt HS001, HS002… theo thứ tự). Mã phải DUY NHẤT, 2–30 ký tự, chỉ gồm chữ không dấu, số, dấu chấm, gạch ngang hoặc gạch dưới, không có khoảng trắng. "name" là họ và tên đầy đủ, giữ nguyên dấu tiếng Việt. Bỏ qua dòng tiêu đề, dòng trống và cột khác.`;
function parseRoster(txt){let t=String(txt||'').trim().replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'');const a=t.indexOf('['),b=t.lastIndexOf(']');
  if(a<0||b<a)return {list:[],errs:['Không thấy mảng JSON dạng [ ... ]']};let d;
  try{d=JSON.parse(stripJsonComments(t.slice(a,b+1)).replace(/,\s*([\]}])/g,'$1'))}catch(e){return {list:[],errs:['JSON không hợp lệ: '+e.message]}}
  if(!Array.isArray(d))d=[];const list=[],errs=[],seen=new Set();
  d.forEach((r,i)=>{const o=r||{},code=String(o.code??o.ma??o['mã']??o.id??'').trim(),name=String(o.name??o.ten??o['tên']??o.hoten??'').trim(),n='Dòng '+(i+1)+': ',nc=ncode(code);
    if(!/^[a-z0-9._-]{2,30}$/.test(nc))return errs.push(n+'mã "'+code+'" không hợp lệ (2–30 ký tự: chữ không dấu, số, . _ -)');
    if(!nn(name))return errs.push(n+'thiếu họ tên');if(seen.has(nc))return errs.push(n+'mã "'+code+'" bị trùng trong file');seen.add(nc);list.push({code,name,nc})});
  return {list,errs}}
function refreshRoster(){if(S.view==='class'&&S.ctab==='ros'&&!$('#mdl')&&!/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||''))render()}
function watchRoster(){if(!FS.ready||FS.wr)return;FS.wr=1;const M=FS.m,g='g_'+fbUser.uid,C=n=>M.collection(FS.db,n),er=n=>e=>console.warn(n,e.code);
  const ls=(q,map,n)=>FS.un.push(M.onSnapshot(q,s=>{s.docChanges().forEach(x=>{if(x.type==='removed')delete map[x.doc.id];else map[x.doc.id]=n==='presence'?(x.doc.data().seen||0):x.doc.data()});refreshRoster()},er(n)));
  ls(M.query(C('rosters'),M.where('teacherId','==',g)),RO,'rosters');ls(M.query(C('rcodes'),M.where('teacherId','==',g)),RC,'rcodes');ls(C('presence'),PRES,'presence');FS.rtk=setInterval(refreshRoster,20000)}
function rosterV(c){const ro=(RO[c.id]||{}).list||[],tn=now(),isOn=x=>{const rc=RC[ncode(x.code)];return !!(rc&&rc.uid&&PRES[rc.uid]&&tn-PRES[rc.uid]<90000)};

    const st=!rc.uid?'<span class="bd bg-slate-100 text-slate-500">Chưa đăng nhập</span>':isOn(x)?'<span class="bd bg-emerald-100 text-emerald-700">🟢 Online</span>':('<span class="bd bg-rose-100 text-rose-700">🔴 Offline</span>'+(sn?' <span class="text-xs text-slate-400">'+fdate(sn)+'</span>':''));

  return `<div class="grid lg:grid-cols-2 gap-5"><div class="card"><h3 class="h2">📋 Danh sách học sinh (${ro.length}) <span class="bd bg-emerald-100 text-emerald-700">${ro.filter(isOn).length} online</span></h3>${ro.length?`<div class="overflow-auto" style="max-height:min(55vh,30rem)"><table class="w-full text-sm whitespace-nowrap"><tr class="text-left text-slate-500 sticky top-0 bg-white"><th>STT</th><th>Mã</th><th>Họ tên</th><th>Trạng thái</th></tr>${rows}</table></div><button class="btn r sm mt-3" onclick="clearRoster('${c.id}')">Xóa toàn bộ danh sách</button>`:EMPTY('Chưa có danh sách – nhập JSON ở khung bên cạnh')}<p class="text-xs text-slate-400 mt-3">Học sinh vào bằng ô “Vào bằng mã do cô phát” ở màn hình đăng nhập (nhập mã + họ tên). Online = hoạt động trong 90 giây gần nhất.</p></div>

<textarea id="rj" class="inp font-mono text-xs" rows="7" oninput="S.rj=this.value" placeholder='[ { "code": "HS001", "name": "Nguyễn Văn An" } ]'>${esc(S.rj||'')}</textarea><div id="rje" class="text-xs text-rose-600 mt-2"></div><div class="flex gap-2 justify-end mt-3"><button class="btn p" onclick="importRoster('${c.id}',0)">＋ Thêm / cập nhật</button><button class="btn r" onclick="importRoster('${c.id}',1)">Thay toàn bộ</button></div></div></div>`}
async function dropRoster(cid,o){const M=FS.m,nc=ncode(o.code),rc=RC[nc];try{if(rc&&rc.uid)await M.updateDoc(M.doc(FS.db,'classes',cid),{students:M.arrayRemove('g_'+rc.uid)});await M.deleteDoc(M.doc(FS.db,'rcodes',nc))}catch(e){console.warn('dropRoster',e.code)}}
async function importRoster(cid,replace){if(!FS.ready)return toast('Cần đăng nhập Google và có mạng để lưu danh sách','error');
  const r=parseRoster($('#rj').value),E=$('#rje');if(!r.list.length){E.innerHTML=(r.errs.length?r.errs:['Không có dòng hợp lệ']).map(x=>'• '+esc(x)).join('<br>');return}
  const M=FS.m,errs=[...r.errs],ok=[];
  for(const x of r.list){try{const q=await M.getDoc(M.doc(FS.db,'rcodes',x.nc));if(q.exists()&&(q.data().teacherId!==me||q.data().classId!==cid)){errs.push('Mã '+x.code+' đã dùng ở lớp/giáo viên khác – hãy đổi mã (vd thêm tiền tố lớp)');continue}
    await M.setDoc(M.doc(FS.db,'rcodes',x.nc),{code:x.nc,classId:cid,teacherId:me,h:hash(nn(x.name)+'|'+x.nc)},{merge:true});ok.push({code:x.code,name:x.name})}catch(e){errs.push('Mã '+x.code+': '+(e.code||e.message))}}
  const cur=((RO[cid]||{}).list)||[],same=(a,b)=>ncode(a.code)===ncode(b.code),list=replace?ok:[...cur.filter(o=>!ok.some(n=>same(n,o))),...ok];
  if(replace)for(const o of cur)if(!list.some(n=>same(n,o)))await dropRoster(cid,o);
  try{await M.setDoc(M.doc(FS.db,'rosters',cid),{teacherId:me,classId:cid,list})}catch(e){return toast('Không lưu được danh sách ('+e.code+')','error')}
  RO[cid]={teacherId:me,classId:cid,list};S.rj=errs.length?S.rj:'';toast('Đã nhập '+ok.length+' học sinh','success');render();
  if(errs.length)modal(`<h3 class="h2 text-amber-600">⚠ ${errs.length} dòng bị bỏ qua</h3><div class="text-sm space-y-1 mb-4">${errs.map(x=>'<p>• '+esc(x)+'</p>').join('')}</div><div class="text-right"><button class="btn p" onclick="closeModal()">Đã hiểu</button></div>`)}
async function clearRoster(cid){if(!await ask('Xóa toàn bộ danh sách học sinh của lớp này? Các tài khoản đã vào bằng mã sẽ bị gỡ khỏi lớp.'))return;
  for(const o of ((RO[cid]||{}).list||[]))await dropRoster(cid,o);try{await FS.m.setDoc(FS.m.doc(FS.db,'rosters',cid),{teacherId:me,classId:cid,list:[]})}catch(e){}RO[cid]={teacherId:me,classId:cid,list:[]};render()}

<textarea class="inp mb-2" rows="2" placeholder="${q.type==='tfg'?'Lệnh dẫn / ngữ cảnh chung của câu (các ý a,b,c,d nhập bên dưới)':'Nội dung câu hỏi'} – công thức: $x^2$ hoặc $$\\frac{a}{b}$$" oninput="E.questions[${i}].text=this.value;mpv('pv${i}',this.value)">${esc(q.text)}</textarea><div id="pv${i}" class="mprev ${hasMath(q.text)?'':'hidden'}">${esc(q.text)}</div>

  return h+'</div>'}
function togQ(i){E.col=E.col||{};E.col[i]=!E.col[i];render()}
function colAll(v){E.col={};if(v)E.questions.forEach((_,i)=>E.col[i]=1);render()}

function mvQ(i,d){E.col={};const j=i+d;if(j<0||j>=E.questions.length)return;[E.questions[i],E.questions[j]]=[E.questions[j],E.questions[i]];render()}

function saveExamVal(){if(!E.title.trim())return 'Nhập tên bài kiểm tra';if(!E.questions.length)return 'Cần ít nhất 1 câu hỏi';if(!(E.minutes>0))return 'Thời gian phải > 0';
  if(JSON.stringify(E).length>900000)return 'Đề quá nặng (nhiều ảnh tải lên) – hãy dùng link ảnh thay vì tải ảnh lên';
  if(E.pickCount>E.questions.length)return 'Số câu bốc ngẫu nhiên ('+E.pickCount+') lớn hơn số câu trong ngân hàng ('+E.questions.length+')';
  if(E.openAt&&E.closeAt&&E.closeAt<=E.openAt)return 'Thời gian đóng đề phải sau thời gian mở đề';
  for(let i=0;i<E.questions.length;i++){const q=E.questions[i],n='Câu '+(i+1)+': ';
    if(!q.text.trim())return n+'chưa có nội dung';
    if(q.type==='mc'&&q.opts.some(o=>!o.trim()))return n+'cần nhập đủ 4 đáp án';
    if(q.type==='tfg'&&q.stmts.some(s=>!s.t.trim()))return n+'cần nhập đủ 4 ý a, b, c, d';
    if(q.type==='match'&&q.pairs.some(p=>!p.l.trim()||!p.r.trim()))return n+'cần nhập đủ các cặp';
    if(q.type==='short'&&!q.answers.split('|').some(x=>x.trim()))return n+'cần có đáp án'}return ''}
async function saveExam(){const bad=saveExamVal();if(bad)return toast(bad,'error');
  if(E._pw!=null){const v=E._pw.trim();if(v==='-')E.pwh='';else if(v)E.pwh=hash('pw|'+v.toLowerCase())}
  const cid=E._cid,{pub,key}=splitExam(E);
  try{await KeyStore.set(pub.id,key)}catch(err){return toast('Không lưu được đáp án: '+(err.message||err),'error')}

PHẠM VI:
- Nếu file có nhiều mã đề, CHỈ chuyển MỘT mã đề: mã ghi ở dòng cuối đoạn lệnh này; để trống thì lấy mã đề đầu tiên.
- Lấy đáp án từ bảng đáp án trong file (đúng cột của mã đề đó). Nếu file không có đáp án thì tự giải và điền đáp án tốt nhất.
- Đề THPT môn Toán gồm 3 phần, giữ nguyên thứ tự câu: Phần I trắc nghiệm 4 đáp án → "mc"; Phần II đúng/sai (4 ý a, b, c, d) → "tfg"; Phần III trả lời ngắn → "short".

QUY TẮC TÁCH CÂU (BẮT BUỘC):
1. MỖI đối tượng {...} trong mảng = ĐÚNG MỘT câu hỏi. Tuyệt đối không gộp nhiều câu vào một đối tượng.
2. Trường "text" CHỈ chứa phần đề bài của câu đó: KHÔNG chứa các lựa chọn A/B/C/D, KHÔNG chứa đáp án, KHÔNG chứa số thứ tự "Câu 1:", KHÔNG xuống dòng.
3. Các lựa chọn A, B, C, D phải nằm trong mảng "opts" (bỏ tiền tố "A.", "B."), mỗi phần tử là một chuỗi.
4. Câu đúng/sai có 4 ý a), b), c), d) là MỘT đối tượng "tfg" duy nhất, KHÔNG tách thành 4 câu: "text" = phần dẫn chung của câu, "stmts" = ĐÚNG 4 ý (bỏ tiền tố "a)", "b)"…), "correct" = mảng 4 giá trị true/false theo thứ tự a, b, c, d. Bảng đáp án ghi "Đ,S,S,S" nghĩa là [true,false,false,false].

KÝ HIỆU TOÁN (QUAN TRỌNG NHẤT):
5. MỌI biểu thức và ký hiệu toán phải nằm trong cặp dấu đô-la $...$, kể cả loại đơn giản như $x=2$, $f(x)=x^{2}$, $u_{1}=4$, $Q_{3}$, $[0;40)$, $A(2;1;-4)$, $\\\\vec{n}=(3;2;-1)$. Áp dụng cho cả "text", "opts", "stmts", "explanation".
6. Không viết toán dạng chữ thô ngoài $...$ (như x^2, sqrt(x), pi, int, ->) và không dùng ký tự Unicode toán (∫ √ π ≤ ≥ → ∈ ℝ) ngoài $...$. Chỉ dùng $...$; KHÔNG dùng \\( \\), \\[ \\] hay $$.
7. Trong JSON PHẢI nhân đôi dấu gạch chéo ngược: viết \\\\frac, \\\\sqrt, \\\\vec, \\\\int, \\\\pi, \\\\leq, \\\\infty, \\\\left, \\\\right…
8. Mẫu chuẩn: phân số $\\\\dfrac{a}{b}$; căn $\\\\sqrt{x}$; mũ $x^{2}$; chỉ số $u_{n}$; vectơ $\\\\overrightarrow{AB}$ hoặc $\\\\vec{u}$; góc $\\\\widehat{ABC}$; độ $60^\\\\circ$; tích phân $\\\\int_{1}^{2}|2x-3|\\\\,dx$; $\\\\log_{3}(2x-1)=2$; tập số $\\\\mathbb{Z}$, $\\\\mathbb{N}^{*}$; tập hợp $\\\\{k\\\\pi\\\\mid k\\\\in\\\\mathbb{Z}\\\\}$; số thập phân trong công thức viết dạng $0{,}85$.

BẢNG, HÌNH, ĐÁP ÁN SỐ:
9. Không chèn ảnh ("img":""). Bảng số liệu viết thành chữ trong "text", ví dụ: Bảng tần số ghép nhóm: $[0;40)$: 11; $[40;80)$: 10; ... Với hình, đồ thị, bảng biến thiên cần cho việc làm bài, thêm vào cuối "text" một câu mô tả ngắn dạng (Hình: ...) chỉ nêu điều nhìn thấy chắc chắn, không bịa số.
10. Trả lời ngắn: "answers" là số thuần, không đơn vị, ghi cả dấu phẩy và dấu chấm nếu có phần thập phân, ví dụ "96,5|96.5". Câu yêu cầu làm tròn thì ghi giá trị đã làm tròn theo đề.

/* v9: sửa mọi dấu \ của LaTeX nằm trong chuỗi JSON (\frac, \sqrt, \{ , \, …) mà AI quên nhân đôi → JSON.parse không còn lỗi và không mất ký hiệu */
function fixLatexEsc(s){let o='',q=false;
  for(let i=0;i<s.length;i++){const c=s[i];
    if(!q){if(c==='"')q=true;o+=c;continue}
    if(c==='"'){q=false;o+=c;continue}
    if(c!=='\\'){o+=c;continue}
    const n=s[i+1];
    if(n===undefined){o+='\\\\';continue}
    if(n==='\\'){o+='\\\\';i++;continue}
    if(n==='"'||n==='/'){o+=c+n;i++;continue}
    if(n==='u'&&/^u[0-9a-fA-F]{4}/.test(s.slice(i+1,i+6))){o+=c;continue}
    if(/[A-Za-z]/.test(n)){const m=/^[A-Za-z]+/.exec(s.slice(i+1))[0];
      if('bfnrt'.includes(n)&&(n==='n'?!LATEX_BFNRT.has(m):m.length===1)){o+=c;continue}
      o+='\\\\';continue}
    o+='\\\\'}
  return o}
function parseAIJson(txt){let s=String(txt||'').trim().replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'');

  s=stripJsonComments(a>=0&&b>a?s.slice(a,b+1):s);let data;
  s=fixLatexEsc(s);
  {let o='',q=false,e=false;for(const c of s){if(q){if(e){o+=c;e=false;continue}if(c==='\\'){o+=c;e=true;continue}if(c==='"'){q=false;o+=c;continue}o+=c==='\n'||c==='\r'||c==='\t'?' ':c}else{if(c==='"')q=true;o+=c}}s=o}
  try{data=JSON.parse(s)}catch(e1){try{data=JSON.parse(s.replace(/,\s*([\]}])/g,'$1'))}catch(e2){
    const m=/position (\d+)/.exec(e1.message),ln=m?s.slice(0,+m[1]).split('\n').length:0;return {qs:[],errs:['JSON không hợp lệ'+(ln?' (gần dòng '+ln+')':'')+': '+e1.message]}}}

  return {qs,errs}}

<div class="flex justify-between mt-4"><button class="btn g" ${T.cur===0||T.e.lockNav?'disabled':''} onclick="T.cur--;T.d.cur=T.cur;saveDraft();render()">← Câu trước</button><button class="btn p" ${T.cur===n-1?'disabled':''} onclick="nextQ()">Câu sau →</button></div><p class="text-xs text-slate-400 text-center mt-4">✔ Tự động lưu mỗi khi bạn chọn đáp án – F5 hoặc mất mạng vẫn khôi phục được</p></div><div class="order-1 lg:order-2 lg:sticky lg:top-20"><div class="card"><div class="flex justify-between text-xs text-slate-500 mb-2"><b>Danh sách câu hỏi · <span id="nprog">0/0</span></b><span><i style="display:inline-block;width:.7rem;height:.7rem;border-radius:.2rem;background:#10b981;vertical-align:-1px"></i> đã làm &nbsp;<i style="display:inline-block;width:.7rem;height:.7rem;border-radius:.2rem;border:1px solid #cbd5e1;vertical-align:-1px"></i> chưa làm</span></div><div class="qgrid" id="nav">${navH()}</div></div></div></div></div>`}
function exitSubmit(){if(!T||T.sending)return;modal(`<div class="border-l-4 border-rose-600 pl-4"><h3 class="h2 text-rose-600">CẢNH BÁO QUY CHẾ THI</h3><p class="text-sm text-slate-700"><b>Bạn đang trong thời gian làm bài!</b> Nếu bạn thoát ra giữa chừng, hệ thống sẽ <b class="text-rose-600">TỰ ĐỘNG NỘP BÀI NGAY LẬP TỨC</b> với các câu đã chọn và <b>tính hết 1 lượt thi</b>. Bạn có chắc chắn muốn nộp và thoát không?</p></div><div class="flex gap-2 justify-end mt-5"><button class="btn g" onclick="closeModal()">Ở lại làm tiếp</button><button class="btn r" onclick="closeModal();submit(true)">Đồng ý nộp</button></div>`)}
function qHtml(){const oi=T.d.order[T.cur],q=T.e.questions[oi],a=T.d.ans[oi];
  let h=`<div class="text-xs font-bold text-indigo-600 mb-1">Câu ${T.cur+1}/${T.d.order.length} · ${TL[q.type]} · ${fmtPts(ptsOf(q))} điểm</div><div class="font-semibold whitespace-pre-wrap mb-3 text-lg">${esc(q.text)}</div>${q.img?`<img referrerpolicy="no-referrer" src="${esc(q.img)}" class="max-h-64 rounded-lg mb-3 cursor-zoom-in" onclick="zoom(this.src)">`:''}`;
  if(q.type==='mc')h+=(T.e.shuffleOpts?seedShuffle(q.opts.length,T.key+':'+oi):q.opts.map((_,z)=>z)).map((i,p)=>{const o=q.opts[i];return `<label class="flex items-center gap-3 p-3 border rounded-xl mb-2 cursor-pointer ${a===i?'bg-indigo-50 border-indigo-500':'hover:bg-slate-50'}"><input type="radio" name="o" ${a===i?'checked':''} onchange="ans(${oi},${i})"><b>${'ABCD'[p]}.</b> ${esc(o)}</label>`}).join('');
  if(q.type==='tfg')h+=(q.stmts||[]).map((s,j)=>{const v=a&&typeof a[j]==='boolean'?a[j]:null;return `<div class="flex flex-col sm:flex-row sm:items-center gap-2 p-3 border rounded-xl mb-2"><div class="flex-1"><b>${'abcd'[j]})</b> ${esc(s)}</div><div class="flex gap-2 shrink-0">${[[true,'Đúng'],[false,'Sai']].map(([b,l])=>`<button onclick="setTf(${oi},${j},${b})" class="px-4 py-2 rounded-lg border-2 font-bold ${v===b?'border-indigo-500 bg-indigo-50 text-indigo-700':'hover:bg-slate-50'}">${l}</button>`).join('')}</div></div>`}).join('');
  if(q.type==='tf')h+=`<div class="grid grid-cols-2 gap-3">${[[true,'✔ Đúng'],[false,'✘ Sai']].map(([v,l])=>`<button onclick="ans(${oi},${v})" class="p-4 rounded-xl border-2 font-bold ${a===v?'border-indigo-500 bg-indigo-50 text-indigo-700':'hover:bg-slate-50'}">${l}</button>`).join('')}</div>`;
  if(q.type==='short')h+=`<input class="inp text-lg" placeholder="Nhập câu trả lời…" value="${esc(a||'')}" oninput="ans(${oi},this.value,1)" onpaste="return false" ondrop="return false" autocomplete="off">`;
  if(q.type==='match'){const used=Object.values(a||{});
    h+=`<div class="grid md:grid-cols-2 gap-4"><div>${q.lefts.map((l,i)=>{const v=a&&a[i];return `<div class="flex items-center gap-2 mb-2"><div class="flex-1 p-2 bg-slate-100 rounded-lg text-sm">${esc(l)}</div>→<div class="flex-1 min-h-[2.5rem] border-2 border-dashed rounded-lg ${v!==undefined?'border-indigo-400':'border-slate-300'}" ondragover="event.preventDefault()" ondrop="drop(event,${oi},${i})" onclick="place(${oi},${i})">${v!==undefined?`<span class="chip" draggable="true" ondragstart="event.dataTransfer.setData('text','${v}')" onclick="event.stopPropagation();unplace(${oi},${i})" title="Bấm để bỏ">${esc(q.rights[v])}</span>`:''}</div></div>`}).join('')}</div>
<div class="p-2 bg-slate-50 rounded-xl"><div class="text-xs text-slate-500 mb-1">Kéo thả vào ô bên trái (hoặc chạm chọn rồi chạm ô)</div>${q.rights.map((r,j)=>used.includes(j)?'':`<span class="chip ${T.sel===j?'ring-2 ring-indigo-500':''}" draggable="true" ondragstart="event.dataTransfer.setData('text','${j}')" onclick="T.sel=${j};refreshQ()">${esc(r)}</span>`).join('')||'<span class="text-xs text-slate-400">Đã ghép hết</span>'}</div></div>`}
  return h}
function refreshQ(){$('#qbox').innerHTML=qHtml();$('#nav').innerHTML=navH();iconize($('#qbox'))}
function ans(oi,v,quiet){T.d.ans[oi]=v;saveDraft();quiet?($('#nav').innerHTML=navH()):refreshQ()}
function setTf(oi,j,v){const a={...(T.d.ans[oi]||{})};if(a[j]===v)delete a[j];else a[j]=v;ans(oi,a)}
function setMatch(oi,i,j){const a={...(T.d.ans[oi]||{})};for(const k in a)if(a[k]===j)delete a[k];a[i]=j;T.sel=null;ans(oi,a)}
function drop(ev,oi,i){ev.preventDefault();setMatch(oi,i,+ev.dataTransfer.getData('text'))}
function place(oi,i){if(T.sel!==null)setMatch(oi,i,T.sel)}
function unplace(oi,i){const a={...(T.d.ans[oi]||{})};delete a[i];ans(oi,a)}
async function submit(auto){if(!T||T.sending)return;
  if(!auto){const left=T.d.order.filter(oi=>!answered(T.d.ans[oi])).length;if(!await ask(left?`Còn ${left} câu chưa trả lời. Vẫn nộp bài?`:'Xác nhận nộp bài?'))return}
  if(!T||T.sending)return;T.sending=true;const e=T.e,d=T.d;let sub;
  try{await syncClock();sub=await Grader.grade(e,d,T.key)} // máy chủ nhận bài làm rồi mới chấm
  catch(err){if(!T)return;T.sending=false;toast('Chưa nộp được: '+(err.message||err)+' — bài làm vẫn được lưu, hãy thử lại.','error');if(auto){clearInterval(T.iv);T.iv=setInterval(clock,5000)}return}
  if(!cloud()&&FS.ready){let ok=0,er;for(let i=0;i<3&&!ok;i++){try{await FS.m.setDoc(FS.m.doc(FS.db,'submissions',sub.id),sub);ok=1}catch(x){er=x;await new Promise(r=>setTimeout(r,700*(i+1)))}}
    if(!ok){if(!T)return;T.sending=false;toast('⚠ Kết quả CHƯA lưu được lên máy chủ ('+(er&&er.code||er)+'). Bài làm vẫn được giữ — hãy bấm Nộp bài lại.','error');if(auto){clearInterval(T.iv);T.iv=setInterval(clock,5000)}return}}
  db.subs[sub.id]=sub;if(FS.ready)synced['submissions/'+sub.id]=sig('submissions',sub);
  delete db.drafts[T.key];localStorage.removeItem(DK+T.key);localStorage.removeItem(TK);save();
  stopTake();closeModal();S={view:'review',arg:sub.id,fresh:1};history.replaceState({v:'review',a:sub.id,i:HI},'','#review');render();scrollTo(0,0)}
function reviewV(){const s=db.subs[S.arg];if(!s)return '<p>Không tìm thấy bài làm</p>';const e=db.exams[s.examId],det=s.detail||[],cs=canSee(s);
  if(!cs.score)return `<button class="btn g sm mb-3" onclick="back()">← Quay lại</button><div class="card text-center max-w-xl mx-auto"><div class="text-5xl">📨</div><h2 class="text-xl font-extrabold mt-2">Đã nộp bài thành công</h2><p class="text-slate-500 mt-1">${esc(s.title)} · ${fdate(s.at)}</p><p class="text-sm text-slate-500 mt-2">Kết quả sẽ hiện khi giáo viên công bố.</p></div>`;
  return `<button class="btn g sm mb-3" onclick="back()">← Quay lại</button><div class="card text-center mb-5 max-w-2xl mx-auto ${s.pass?'bg-emerald-50 border-emerald-300':'bg-rose-50 border-rose-300'}"><div class="text-5xl">${s.pass?'🎉':'💪'}</div><h2 class="text-2xl font-extrabold mt-1 ${s.pass?'text-emerald-700':'text-rose-700'}">${s.pass?'BẠN ĐÃ ĐẠT':'BẠN CHƯA ĐẠT'}</h2><p class="text-4xl font-black mt-2">${s.score}<span class="text-lg text-slate-400">/10</span></p><p class="text-sm text-slate-500">${esc(s.title)} · đúng ${s.correct}/${s.total} câu${s.max!==undefined?' · '+fmtPts(s.pts)+'/'+fmtPts(s.max)+' điểm gốc':''} · ${fdate(s.at)}</p>${s.viol?`<p class="text-sm font-bold text-rose-600 mt-1">⚠ Đã rời khỏi bài thi ${s.viol} lần</p>`:''}</div>
${!cs.detail?'<div class="card text-center text-sm text-slate-500">Đáp án chi tiết sẽ hiện khi giáo viên công bố kết quả.</div>':(e||det.length)?(det.length&&det[0].t!==undefined?det.map((d,i)=>({text:d.t,type:d.y,img:(e&&e.questions[d.qi??i]&&e.questions[d.qi??i].text===d.t)?e.questions[d.qi??i].img:'',stmts:(e&&e.questions[d.qi??i]&&e.questions[d.qi??i].text===d.t)?e.questions[d.qi??i].stmts:null})):e.questions).map((q,i)=>{const d=det[i]||{},good=d.r===true,part=d.r===false&&d.f>0;return `<div class="card mb-3 border-l-4 ${good?'border-l-emerald-500':part?'border-l-amber-500':'border-l-rose-500'}"><b class="text-sm text-slate-500">Câu ${i+1} · ${TL[q.type]} ${good?'✅':d.r===null?'⬜ bỏ trống':part?'◐ đúng '+d.n+'/4 ý':'❌'}${d.w!==undefined?' · '+fmtPts(d.w*d.f)+'/'+fmtPts(d.w)+' điểm':''}</b><p class="font-semibold whitespace-pre-wrap my-1">${esc(q.text)}</p>${q.img?`<img referrerpolicy="no-referrer" src="${esc(q.img)}" class="max-h-40 rounded-lg my-2 cursor-zoom-in" onclick="zoom(this.src)">`:''}${(q.type==='tfg'&&d.sa&&q.stmts)?q.stmts.map((s,j)=>{const ok=d.sa[j]!==null&&d.sa[j]===d.sc[j],lb=v=>v===null?'bỏ trống':v?'Đúng':'Sai';return `<div class="text-sm flex flex-wrap gap-x-2 py-1 border-t first:border-t-0"><span><b>${'abcd'[j]})</b> ${esc(s)}</span><span class="ml-auto whitespace-nowrap ${ok?'text-emerald-700':'text-rose-600'} font-semibold">Bạn chọn: ${lb(d.sa[j])}${ok?' ✓':' · đáp án: '+lb(d.sc[j])}</span></div>`}).join(''):`<p class="text-sm">Bạn chọn: ${d.a?esc(d.a):'<i class="text-slate-400">(chưa trả lời)</i>'}</p>${good?'':`<p class="text-sm text-emerald-700">Đáp án đúng: ${esc(d.c||'')}</p>`}`}${d.x?`<p class="text-sm mt-2 p-2 rounded-lg bg-amber-50 text-amber-800">💡 ${esc(d.x)}</p>`:''}</div>`}).join(''):'<p class="text-slate-500 text-center">Đề thi gốc đã bị giáo viên xóa nên không xem được chi tiết.</p>'}`}

/* ============ 8. KHỞI ĐỘNG – khôi phục bài đang làm khi F5 ============ */
(function boot(){let t=null;try{t=JSON.parse(localStorage.getItem(TK))}catch(e){}
  const ok=me&&U()&&U().role,st=history.state;
  if(ok&&t&&t.me===me&&db.exams[t.id]){HI=(st&&st.i)||0;history.replaceState({v:'take',a:t.id,i:HI},'','#take');startExam(t.id,1);toast('Đã khôi phục bài làm và thời gian còn lại','success')}
  else if(ok&&st&&st.v)applyState(st);
  else{history.replaceState({v:'home',a:null,i:0},'','#home');render()}})();
</script>
</body>
</html>
